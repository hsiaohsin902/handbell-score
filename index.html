<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>手鐘彩色旋律譜產生器</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --bell-1: #c00000;
      --bell-2: #ff7700;
      --bell-3: #ffee00;
      --bell-4: #8bc34a;
      --bell-5: #00b0f0;
      --bell-6: #0000e6;
      --bell-7: #6a2894;
      --bell-8: #c00000;

      --bw-1: #e51c23;
      --bw-2: #ff7700;
      --bw-3: #ffee00;
      --bw-4: #8bc34a;
      --bw-5: #2e7d32;
      --bw-6: #1976d2;
      --bw-7: #6a2894;
      --bw-8: #e51c23;

      --note-1: var(--bell-1);
      --note-2: var(--bell-2);
      --note-3: var(--bell-3);
      --note-4: var(--bell-4);
      --note-5: var(--bell-5);
      --note-6: var(--bell-6);
      --note-7: var(--bell-7);
      --note-8: var(--bell-8);

      --sheet-scale: 1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 16px;
      color: #333;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-card {
      background: #ffffff;
      padding: 16px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-icon {
      font-size: 32px;
      line-height: 1;
    }

    .title-group h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, select {
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      touch-action: manipulation;
    }

    button:hover:not(:disabled) {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-undo { background: #64748b; color: white; border: none; }
    .btn-undo:hover:not(:disabled) { background: #475569; }
    .btn-primary { background: #3b82f6; color: white; border: none; }
    .btn-primary:hover:not(:disabled) { background: #2563eb; }
    .btn-dark { background: #1e293b; color: white; border: none; }
    .btn-dark:hover:not(:disabled) { background: #0f172a; }
    .btn-img { background: #8b5cf6; color: white; border: none; }
    .btn-img:hover:not(:disabled) { background: #7c3aed; }
    .btn-success { background: #10b981; color: white; border: none; }
    .btn-success:hover:not(:disabled) { background: #059669; }

    .control-panel {
      background: #ffffff;
      padding: 16px 18px;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .pill-group {
      display: inline-flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
      flex-wrap: wrap;
    }

    .pill-btn {
      padding: 6px 12px;
      font-size: 13px;
      border: none;
      background: transparent;
      border-radius: 6px;
      color: #475569;
      cursor: pointer;
    }

    .pill-btn.active {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      font-weight: bold;
    }

    .scale-controls {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      font-size: 13px;
      font-weight: bold;
      color: #475569;
    }

    .scale-btn {
      padding: 3px 8px;
      font-size: 14px;
      border-radius: 6px;
      background: #fff;
      border: 1px solid #cbd5e1;
    }

    .scale-text {
      min-width: 44px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .palette-box {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      flex-wrap: wrap;
    }

    .color-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 8px;
      border: 2px solid transparent;
      transition: all 0.15s ease;
    }

    .color-chip:hover {
      background: #edf2f7;
    }

    .color-chip.brush-active {
      background: #e0f2fe;
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }

    .color-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      margin-bottom: 3px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .circle-tool {
      background: #fff;
      border: 2px dashed #94a3b8;
      color: #475569;
      text-shadow: none;
    }

    .editor-section {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      color: #1e293b;
    }

    .header-btns {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .line-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .edit-row {
      display: grid;
      grid-template-columns: 32px 1fr 1fr 34px 34px;
      gap: 8px;
      align-items: center;
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }

    .edit-row.spacer-row {
      background: #fffdf5;
      border-color: #fde68a;
      grid-template-columns: 32px 1fr 34px 34px;
    }

    .row-index {
      font-size: 13px;
      font-weight: bold;
      color: #94a3b8;
      text-align: center;
    }

    .input-lyric, .input-notes {
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      background: #ffffff;
      width: 100%;
      box-sizing: border-box;
    }

    .input-notes {
      font-family: monospace;
      color: #2563eb;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .btn-icon {
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .btn-icon:hover { color: #dc2626; border-color: #fca5a5; background: #fff5f5; }
    .btn-add-inline:hover { color: #2563eb; border-color: #93c5fd; background: #eff6ff; }

    .sheet-paper {
      background: #ffffff;
      padding: calc(36px * var(--sheet-scale)) calc(30px * var(--sheet-scale));
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      gap: calc(32px * var(--sheet-scale));
      min-height: 400px;
      overflow-x: auto;
    }

    .score-line {
      display: flex;
      flex-wrap: wrap;
      gap: calc(16px * var(--sheet-scale)) calc(10px * var(--sheet-scale));
      align-items: flex-end;
    }

    .score-spacer {
      height: calc(24px * var(--sheet-scale));
      border-bottom: 2px dashed #e2e8f0;
      margin: calc(10px * var(--sheet-scale)) 0;
    }

    .note-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: calc(44px * var(--sheet-scale));
    }

    .lyric-char {
      font-family: "KaiTi", "BiauKai", "DFKai-SB", "Noto Serif TC", serif;
      font-size: calc(26px * var(--sheet-scale));
      font-weight: bold;
      line-height: 1.2;
      margin-bottom: calc(8px * var(--sheet-scale));
      color: #0f172a;
      min-height: calc(32px * var(--sheet-scale));
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    body.hide-lyrics .lyric-char {
      visibility: hidden;
      opacity: 0;
    }

    .bell-ball {
      width: calc(44px * var(--sheet-scale));
      height: calc(44px * var(--sheet-scale));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(18px * var(--sheet-scale));
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
      user-select: none;
      box-sizing: border-box;
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: pointer;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .bell-ball:hover {
      transform: scale(1.08);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .bell-ball.ball-empty {
      border: calc(2px * var(--sheet-scale)) dashed #cbd5e1;
      background: transparent;
      color: transparent;
      cursor: pointer;
    }
    .bell-ball.ball-empty:hover {
      border-color: #3b82f6;
      background: #eff6ff;
    }

    .note-c1 { background-color: var(--note-1) !important; }
    .note-c2 { background-color: var(--note-2) !important; }
    .note-c3 { background-color: var(--note-3) !important; color: #1e293b !important; text-shadow: none !important; }
    .note-c4 { background-color: var(--note-4) !important; }
    .note-c5 { background-color: var(--note-5) !important; }
    .note-c6 { background-color: var(--note-6) !important; }
    .note-c7 { background-color: var(--note-7) !important; }
    .note-c8 {
      background-color: var(--note-8) !important;
      border: calc(5px * var(--sheet-scale)) solid #0f172a !important;
    }
    .note-c8.white-style {
      background-color: #ffffff !important;
      color: #0f172a !important;
      text-shadow: none !important;
      border: calc(4px * var(--sheet-scale)) solid #0f172a !important;
    }

    .note-c0 {
      background: transparent !important;
      border: calc(2px * var(--sheet-scale)) dashed #94a3b8 !important;
      color: #94a3b8 !important;
      text-shadow: none !important;
    }

    .note-dash {
      background: transparent !important;
      border: calc(2px * var(--sheet-scale)) dotted #cbd5e1 !important;
      color: #94a3b8 !important;
      text-shadow: none !important;
    }

    .coloring-mode .bell-ball {
      background: #ffffff !important;
      border: calc(2px * var(--sheet-scale)) solid #0f172a !important;
      color: #0f172a !important;
      text-shadow: none !important;
    }
    .coloring-mode .bell-ball.note-c8 {
      border: calc(5px * var(--sheet-scale)) solid #000000 !important;
    }

    #fsFloatingToolbar {
      display: none;
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 99999;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      padding: 4px 8px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      align-items: center;
      gap: 5px;
      user-select: none;
      touch-action: none;
    }

    .drag-handle {
      cursor: grab;
      color: #94a3b8;
      font-size: 14px;
      padding: 0 4px;
      display: flex;
      align-items: center;
    }
    .drag-handle:active {
      cursor: grabbing;
    }

    #fsFloatingToolbar button {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }

    #fsFloatingToolbar button:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    #btnExitFullScreen {
      background: #ef4444 !important;
      border: none !important;
      color: white !important;
    }

    /* 浮水印樣式 */
    .watermark-footer {
      text-align: center;
      margin-top: 24px;
      padding-bottom: 24px;
      font-size: 14px;
      font-weight: bold;
      color: #94a3b8;
      user-select: none;
    }

    body.fullscreen {
      background: #ffffff;
      padding: 20px;
    }
    body.fullscreen #fsFloatingToolbar {
      display: flex !important;
    }
    body.fullscreen .header-card,
    body.fullscreen .control-panel,
    body.fullscreen .editor-section,
    body.fullscreen .watermark-footer {
      display: none !important;
    }
    body.fullscreen .sheet-paper {
      box-shadow: none;
      padding: 0;
      width: 100%;
      box-sizing: border-box;
    }

    @media print {
      @page {
        margin: 1.2cm;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
      body {
        background: #ffffff !important;
        padding: 0 !important;
      }
      .header-card, .control-panel, .editor-section, #fsFloatingToolbar {
        display: none !important;
      }
      .sheet-paper {
        box-shadow: none !important;
        padding: 0 !important;
      }
      .score-line {
        page-break-inside: avoid;
      }
      /* 列印時強制顯示浮水印 */
      .watermark-footer {
        display: block !important;
        margin-top: 40px !important;
      }
    }
  </style>
</head>
<body>

<div id="fsFloatingToolbar">
  <span class="drag-handle" title="按住拖曳移動位置">⠿</span>
  <button onclick="zoomOut()">－</button>
  <span id="fsScaleText" style="color:white; font-size:11px; font-weight:bold; min-width:32px; text-align:center;">100%</span>
  <button onclick="zoomIn()">＋</button>
  <button onclick="fitToScreen()">滿版</button>
  <button id="btnExitFullScreen" onclick="exitFullScreen()">✕ 退出</button>
</div>

<div class="container">
  <div class="header-card">
    <div class="title-group">
      <div class="app-icon">🔔</div>
      <h1>手鐘彩色旋律譜產生器</h1>
    </div>
    <div class="top-actions">
      <button class="btn-primary" onclick="enterFullScreen()">🖥️ 全螢幕教學投影</button>
      <button class="btn-dark" onclick="window.print()">🖨️ 列印 / 存為PDF</button>
      <button class="btn-img" id="btnExportImg" onclick="exportAsImage()">🖼️ 匯出圖片 (PNG)</button>
    </div>
  </div>

  <div class="control-panel">
    <div class="control-row">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:13px; font-weight:bold;">樂器色系方案：</span>
        <div class="pill-group">
          <button class="pill-btn active" id="btnInstBell" onclick="setInstrument('bell')">🔔 標準彩虹手鐘</button>
          <button class="pill-btn" id="btnInstBW" onclick="setInstrument('boomwhackers')">🥢 律音管 Boomwhackers</button>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:13px; font-weight:bold;">第8音(高音Do)樣式：</span>
        <div class="pill-group">
          <button class="pill-btn active" id="btnHighBorder" onclick="setHighDoStyle('border')">🔴 粗黑框紅</button>
          <button class="pill-btn" id="btnHighWhite" onclick="setHighDoStyle('white')">⚪ 白色 (White)</button>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:13px; font-weight:bold;">歌詞顯示：</span>
        <div class="pill-group">
          <button class="pill-btn active" id="btnLyricShow" onclick="setLyricVisibility(true)">👀 顯示歌詞</button>
          <button class="pill-btn" id="btnLyricHide" onclick="setLyricVisibility(false)">🙈 隱藏歌詞</button>
        </div>
      </div>
    </div>

    <div class="palette-box" id="paletteBox"></div>

    <div class="control-row">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:13px; font-weight:bold;">⚡ 載入曲目：</span>
        <select id="selSongPreset" onchange="loadSelectedSong(this.value)">
          <option value="">-- 請選擇曲庫歌曲 --</option>
          <option value="twinkle">小星星</option>
          <option value="bee">小蜜蜂</option>
          <option value="london">倫敦鐵橋垮下來</option>
          <option value="lamb">瑪莉有隻小綿羊</option>
          <option value="tigers">兩隻老虎</option>
          <option value="jingle">聖誕鈴聲</option>
          <option value="butterfly">蝴蝶</option>
          <option value="greenoil">綠油精</option>
          <option value="frog">小青蛙</option>
          <option value="dog">哈巴狗</option>
          <option value="oldmac">王老先生有塊地</option>
          <option value="bus">公車的輪子轉呀轉</option>
          <option value="spring">春神來了</option>
          <option value="joy">快樂頌</option>
          <option value="doremi">Do Re Mi之歌</option>
          <option value="lullaby">搖籃曲</option>
          <option value="jasmine">茉莉花</option>
          <option value="skyrain">天公落水</option>
          <option value="grace">奇異恩典</option>
          <option value="happyyear">歡樂年華</option>
        </select>
      </div>

      <div style="display:flex; align-items:center; gap:6px;">
        <span style="font-size:13px; font-weight:bold;">樂譜縮放：</span>
        <div class="scale-controls">
          <button class="scale-btn" onclick="zoomOut()">－</button>
          <span class="scale-text" id="scaleText">100%</span>
          <button class="scale-btn" onclick="zoomIn()">＋</button>
          <button class="scale-btn" onclick="resetZoom()" title="重設為 100%">100%</button>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:13px; font-weight:bold;">圓圈樣式：</span>
        <div class="pill-group">
          <button class="pill-btn active" id="btnStyleNum" onclick="setBallDisplayMode('number')">簡譜數字(8)</button>
          <button class="pill-btn" id="btnStyleSolf" onclick="setBallDisplayMode('solfege')">唱名音名</button>
          <button class="pill-btn" id="btnStylePure" onclick="setBallDisplayMode('pure')">純色圈圈</button>
        </div>
        <button id="btnColoring" onclick="toggleColoringMode()">🖍️ 透明黑框著色譜</button>
      </div>
    </div>
  </div>

  <div class="editor-section">
    <div class="section-header">
      <h2>📝 樂句編輯區（歌詞 ＋ 數字）</h2>
      <div class="header-btns">
        <button class="btn-success" onclick="appendNewLine()">＋ 新增樂句</button>
        <button class="btn-undo" id="btnUndo" onclick="undo()" disabled>↶ 還原上一步</button>
        <button onclick="appendSpacer()">＋ 插入分段空行</button>
      </div>
    </div>
    <div class="line-list" id="lineList"></div>
  </div>

  <div class="sheet-paper" id="sheetPaper"></div>

  <!-- 浮水印區塊 -->
  <div class="watermark-footer">
    設計者：蕭忻 職能治療師/實習音樂治療師
  </div>

</div>

<script>
  const SONG_DATABASE = {
    twinkle: [
      { lyric: "一閃一閃亮晶晶", notes: "1155665" },
      { lyric: "滿天都是小星星", notes: "4433221" },
      { lyric: "掛在天上放光明", notes: "5544332" },
      { lyric: "好像許多小眼睛", notes: "5544332" },
      { lyric: "一閃一閃亮晶晶", notes: "1155665" },
      { lyric: "滿天都是小星星", notes: "4433221" }
    ],
    bee: [

  let historyStack = [];

  function pushHistory() {
    historyStack.push(JSON.stringify(scoreData));
    if (historyStack.length > 50) historyStack.shift();
    updateUndoButtonState();
  }

  function undo() {
    if (historyStack.length === 0) return;
    scoreData = JSON.parse(historyStack.pop());
    renderAll();
    updateUndoButtonState();
  }

  function updateUndoButtonState() {
    const btn = document.getElementById('btnUndo');
    if (btn) btn.disabled = historyStack.length === 0;
  }

  function loadSelectedSong(key) {
    if (!key || !SONG_DATABASE[key]) return;
    pushHistory();
    scoreData = JSON.parse(JSON.stringify(SONG_DATABASE[key]));
    renderAll();
  }

  function setInstrument(type) {
    currentInstrument = type;
    document.getElementById('btnInstBell').classList.toggle('active', type === 'bell');
    document.getElementById('btnInstBW').classList.toggle('active', type === 'boomwhackers');

    const r = document.documentElement.style;
    for (let i = 1; i <= 8; i++) {
      r.setProperty(`--note-${i}`, type === 'boomwhackers' ? `var(--bw-${i})` : `var(--bell-${i})`);
    }
    renderPalette();
    renderAll();
  }

    document.getElementById('btnHighBorder').classList.toggle('active', style === 'border');

    renderAll();

    ballDisplayMode = mode;
    document.getElementById('btnStyleNum').classList.toggle('active', mode === 'number');
    document.getElementById('btnStyleSolf').classList.toggle('active', mode === 'solfege');

    document.body.classList.toggle('coloring-mode', isColoring);
    document.getElementById('btnColoring').style.background = isColoring ? '#fee2e2' : '';
    document.getElementById('btnColoring').style.borderColor = isColoring ? '#ef4444' : '';

  function applyScale(val) {
    currentScale = Math.min(Math.max(val, 0.6), 2.2);
    document.documentElement.style.setProperty('--sheet-scale', currentScale);
    const percentText = Math.round(currentScale * 100) + '%';
    const sEl = document.getElementById('scaleText');
    const fsEl = document.getElementById('fsScaleText');
    if (sEl) sEl.innerText = percentText;
    if (fsEl) fsEl.innerText = percentText;
  }

  function zoomIn() {
    applyScale(currentScale + 0.15);
  }

  function zoomOut() {
    applyScale(currentScale - 0.15);
  }

  function resetZoom() {
    applyScale(1.0);
  }

  function fitToScreen() {
    const paper = document.getElementById('sheetPaper');
    if (!paper) return;
    const windowWidth = window.innerWidth - 40;
    let maxCols = 8;
    scoreData.forEach(item => {
      const len = Math.max((item.lyric || '').length, (item.notes || '').length);
      if (len > maxCols) maxCols = len;
    });
    const idealColWidth = windowWidth / maxCols;
    const targetScale = idealColWidth / 56;
    applyScale(targetScale);
  }

  function exportAsImage() {
    const paper = document.getElementById('sheetPaper');
    const btn = document.getElementById('btnExportImg');
    if (!paper) return;

    const originalText = btn.innerText;
    btn.innerText = '⏳ 處理中...';
    btn.disabled = true;

    html2canvas(paper, {
      scale: 2,
      backgroundColor: '#ffffff',
      useCORS: true,
      logging: false
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = `手鐘樂譜_${new Date().toISOString().slice(0,10)}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(err => {
      alert('圖片匯出失敗，請重試或使用截圖/列印功能。');
      console.error(err);
    }).finally(() => {
      btn.innerText = originalText;
      btn.disabled = false;
    });
  }

  function enterFullScreen() {
    document.body.classList.add('fullscreen');
    window.history.pushState({ isFullscreen: true }, '');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (window.innerWidth < 800) {
      fitToScreen();
    }

  function exitFullScreen() {
    if (document.body.classList.contains('fullscreen')) {
      document.body.classList.remove('fullscreen');
      if (window.history.state && window.history.state.isFullscreen) {
        window.history.back();
      }
    }
  }

    if (document.body.classList.contains('fullscreen')) {

    }

  (function initDraggableToolbar() {
    const toolbar = document.getElementById('fsFloatingToolbar');
    let isDragging = false;
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;

    function onPointerDown(e) {
      if (e.target.tagName.toLowerCase() === 'button') return;

      isDragging = true;
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);

      startX = clientX;
      startY = clientY;

      const rect = toolbar.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      toolbar.style.right = 'auto';
      toolbar.style.left = initialLeft + 'px';
      toolbar.style.top = initialTop + 'px';

      document.addEventListener('pointermove', onPointerMove);
      document.addEventListener('pointerup', onPointerUp);
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);

      let newX = initialLeft + (clientX - startX);
      let newY = initialTop + (clientY - startY);

      const maxW = window.innerWidth - toolbar.offsetWidth - 8;
      const maxH = window.innerHeight - toolbar.offsetHeight - 8;

      newX = Math.max(8, Math.min(newX, maxW));
      newY = Math.max(8, Math.min(newY, maxH));

      toolbar.style.left = newX + 'px';
      toolbar.style.top = newY + 'px';
    }

    function onPointerUp() {
      isDragging = false;
      document.removeEventListener('pointermove', onPointerMove);
      document.removeEventListener('pointerup', onPointerUp);
    }

    toolbar.addEventListener('pointerdown', onPointerDown);
  })();

  function renderPalette() {
    const isBW = currentInstrument === 'boomwhackers';
    const names = isBW 
      ? ['1·Do', '2·Re', '3·Mi', '4·Fa(淺綠)', '5·Sol(深綠)', '6·La', '7·Ti', '8·Do(高)']
      : ['1·Do', '2·Re', '3·Mi', '4·Fa', '5·Sol', '6·La', '7·Ti', '8·Do(高)'];

    let html = `<span style="font-size:12px; font-weight:800; color:#64748b;">音色筆刷 (點選直接在下方樂譜著色)：</span>`;

    for (let i = 1; i <= 8; i++) {
      let extraClass = (i === 8 && highDoStyle === 'white') ? 'white-style' : '';
      let isSelected = (activeBrush === String(i)) ? 'brush-active' : '';
      html += `
        <div class="color-chip ${isSelected}" onclick="setBrush('${i}')" title="點選作為上色筆刷">
          <div class="color-circle note-c${i} ${extraClass}">${i}</div>
          <span>${names[i-1]}</span>
        </div>
      `;
    }

    const is0Selected = (activeBrush === '0') ? 'brush-active' : '';
    html += `
      <div class="color-chip ${is0Selected}" onclick="setBrush('0')" title="休止符筆刷">
        <div class="color-circle note-c0" style="border: 2px dashed #94a3b8; color: #64748b; background: transparent; text-shadow:none;">0</div>
        <span>休止符</span>
      </div>
    `;

    const isDashSelected = (activeBrush === '-') ? 'brush-active' : '';
    html += `
      <div class="color-chip ${isDashSelected}" onclick="setBrush('-')" title="延長線筆刷">
        <div class="color-circle note-dash" style="border: 2px dotted #94a3b8; color: #64748b; background: transparent; text-shadow:none;">-</div>
        <span>延長音</span>
      </div>
    `;

    const isEraserSelected = (activeBrush === 'eraser') ? 'brush-active' : '';
    html += `
      <div class="color-chip ${isEraserSelected}" onclick="setBrush('eraser')" title="橡皮擦：點擊音符擦除清空">
        <div class="color-circle circle-tool" style="font-size: 16px;">🧹</div>
        <span>橡皮擦</span>
      </div>
    `;

    document.getElementById('paletteBox').innerHTML = html;
  }

          <button class="btn-icon" title="刪除分段" onclick="deleteLine(${index})">✕</button>
        `;
      } else {
        row.className = 'edit-row';
        row.innerHTML = `
          <div class="row-index">${index + 1}</div>
          <input class="input-lyric" type="text" placeholder="歌詞（空行代表分段）" value="${escapeHtml(item.lyric)}"
            onfocus="onInputFocus()"
            oninput="updateLine(${index}, 'lyric', this.value)">
          <input class="input-notes" id="notes-input-${index}" type="text" placeholder="數字音名 (1~8, 0休止, -延長)" value="${escapeHtml(item.notes)}"
            onfocus="onInputFocus()"
            oninput="updateLine(${index}, 'notes', this.value)">
          <button class="btn-icon btn-add-inline" title="在此下方插入樂句" onclick="insertLine(${index})">＋</button>
          <button class="btn-icon" title="刪除此句" onclick="deleteLine(${index})">✕</button>
        `;
      }
      container.appendChild(row);
    });

  function onInputFocus() {
    pushHistory();
  }

  function applyBrushToNote(lineIndex, charIndex) {
    pushHistory();
    let line = scoreData[lineIndex];
    let noteArr = Array.from(line.notes || '');

    while (noteArr.length <= charIndex) {
      noteArr.push(' ');
    }

    if (activeBrush === 'eraser') {
      noteArr[charIndex] = ' ';
    } else if (activeBrush) {
      noteArr[charIndex] = activeBrush;
    }

    line.notes = noteArr.join('').replace(/\s+$/, '');
    
    const noteInput = document.getElementById(`notes-input-${lineIndex}`);
    if (noteInput) {
      noteInput.value = line.notes;
    }

    renderScoreSheet();
  }

  function clearNoteByRightClick(e, lineIndex, charIndex) {
    e.preventDefault();
    pushHistory();
    let line = scoreData[lineIndex];
    let noteArr = Array.from(line.notes || '');
    if (charIndex < noteArr.length) {
      noteArr[charIndex] = ' ';
      line.notes = noteArr.join('').replace(/\s+$/, '');
      const noteInput = document.getElementById(`notes-input-${lineIndex}`);
      if (noteInput) {
        noteInput.value = line.notes;
      }
      renderScoreSheet();
    }
  }

  function renderScoreSheet() {
    const container = document.getElementById('sheetPaper');
    container.innerHTML = '';

    const solfegeMap = {
      '1': 'Do', '2': 'Re', '3': 'Mi', '4': 'Fa',
      '5': 'Sol', '6': 'La', '7': 'Ti', '8': 'Do'
    };

    scoreData.forEach((item, lineIndex) => {
      const isSpacer = (!item.lyric || item.lyric.trim() === '') && (!item.notes || item.notes.trim() === '');
      if (isSpacer) {
        const spacer = document.createElement('div');
        spacer.className = 'score-spacer';
        container.appendChild(spacer);
        return;
      }

      const lineRow = document.createElement('div');
      lineRow.className = 'score-line';

      const lyrics = Array.from(item.lyric || '');
      const notes = Array.from(item.notes || '');
      const maxLen = Math.max(lyrics.length, notes.length);

      for (let charIndex = 0; charIndex < maxLen; charIndex++) {
        const ch = lyrics[charIndex] || '';
        const nt = notes[charIndex] || '';

        let noteHtml = '';
        if (nt === '' || nt === ' ') {
          noteHtml = `<div class="bell-ball ball-empty" 
            title="點擊填入目前筆刷音符" 
            onclick="applyBrushToNote(${lineIndex}, ${charIndex})"
            oncontextmenu="clearNoteByRightClick(event, ${lineIndex}, ${charIndex})"></div>`;
        } else if (nt >= '1' && nt <= '8') {
          const whiteClass = (nt === '8' && highDoStyle === 'white') ? 'white-style' : '';
          let text = '';
          if (ballDisplayMode === 'number') text = nt;
          else if (ballDisplayMode === 'solfege') text = solfegeMap[nt];
          else if (ballDisplayMode === 'pure') text = '';

          noteHtml = `<div class="bell-ball note-c${nt} ${whiteClass}" 
            title="點擊替換 / 右鍵清空" 
            onclick="applyBrushToNote(${lineIndex}, ${charIndex})"
            oncontextmenu="clearNoteByRightClick(event, ${lineIndex}, ${charIndex})">${text}</div>`;
        } else if (nt === '0') {
          noteHtml = `<div class="bell-ball note-c0" 
            title="點擊替換 / 右鍵清空" 
            onclick="applyBrushToNote(${lineIndex}, ${charIndex})"
            oncontextmenu="clearNoteByRightClick(event, ${lineIndex}, ${charIndex})">${ballDisplayMode === 'pure' ? '' : '0'}</div>`;
        } else if (nt === '-' || nt === '~') {
          noteHtml = `<div class="bell-ball note-dash" 
            title="點擊替換 / 右鍵清空" 
            onclick="applyBrushToNote(${lineIndex}, ${charIndex})"
            oncontextmenu="clearNoteByRightClick(event, ${lineIndex}, ${charIndex})">${ballDisplayMode === 'pure' ? '' : '-'}</div>`;
        } else {
          noteHtml = `<div class="bell-ball note-c0" 
            title="點擊替換 / 右鍵清空" 
            onclick="applyBrushToNote(${lineIndex}, ${charIndex})"
            oncontextmenu="clearNoteByRightClick(event, ${lineIndex}, ${charIndex})">${nt}</div>`;
        }

        const col = document.createElement('div');
        col.className = 'note-column';
        col.innerHTML = `
          <div class="lyric-char">${ch === ' ' ? '&nbsp;' : escapeHtml(ch)}</div>
          ${noteHtml}
        `;
        lineRow.appendChild(col);
      }

      container.appendChild(lineRow);
    });
  }

  function escapeHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function updateLine(index, field, val) {
    scoreData[index][field] = val;
    renderScoreSheet();
  }

  function appendNewLine() {
    pushHistory();
    scoreData.push({ lyric: "新歌詞", notes: "12345" });
    renderAll();
  }

  function appendSpacer() {
    pushHistory();
    scoreData.push({ lyric: "", notes: "" });
    renderAll();
  }

  function insertLine(index) {
    pushHistory();
    scoreData.splice(index + 1, 0, { lyric: "新樂句", notes: "1234" });
    renderAll();
  }

  function deleteLine(index) {
    pushHistory();
    scoreData.splice(index, 1);
    renderAll();
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.body.classList.contains('fullscreen')) {
      exitFullScreen();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      undo();
    }
  });

  renderPalette();
  renderAll();
</script>

</body>
</html>
